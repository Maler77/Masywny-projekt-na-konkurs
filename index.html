<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prosta przeglądarkowa baza gry.">
    <title>Projekt konkursowy — gra</title>
    <link rel="stylesheet" href="src/css/style.css">
    <script type="module" src="src/js/main.js"></script>
</head>
<body>
    <main class="page">
        <header class="page__header">
            <p class="eyebrow">Projekt konkursowy</p>
            <h1>Gra przeglądarkowa</h1>
            <p class="intro">Podstawowa scena gry jest gotowa na dalszą rozbudowę.</p>
        </header>

        <section class="game" aria-labelledby="game-title">
            <h2 id="game-title" class="visually-hidden">Obszar gry</h2>
            <canvas class="game__viewport" aria-label="Obszar gry 2D" role="img"></canvas>
        </section>
    </main>
</body>
</html>
